<VirtualHost *:80>
    ServerAdmin webmaster@example.com
    DocumentRoot "/www/wwwroot/front-v2-tuempleo/frontend/build/build"
    ServerName 282d0f3d.tuvacante.com
    ServerAlias tuvacante.com www.tuvacante.com

    ErrorLog "/www/wwwlogs/tuvacante.com-error_log"
    CustomLog "/www/wwwlogs/tuvacante.com-access_log" combined

    #HTTP_TO_HTTPS_START
    <IfModule mod_rewrite.c>
        RewriteEngine on
        RewriteCond %{SERVER_PORT} !^443$
        RewriteRule (.*) https://%{SERVER_NAME}$1 [L,R=301]
    </IfModule>
    #HTTP_TO_HTTPS_END

    # DENY FILES
    <Files ~ (\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)$>
        Order allow,deny
        Deny from all
    </Files>

    # PHP
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/tmp/php-cgi-83.sock|fcgi://localhost"
    </FilesMatch>

    # PATH
    <Directory "/www/wwwroot/front-v2-tuempleo/frontend/build/build">
        SetOutputFilter DEFLATE
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm default.php default.html default.htm
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@example.com
    DocumentRoot "/www/wwwroot/front-v2-tuempleo/frontend/build/build"
    ServerName tuvacante.com
    ServerAlias www.tuvacante.com

    # Logs
    ErrorLog "/www/wwwlogs/tuvacante.com-error_log"
    CustomLog "/www/wwwlogs/tuvacante.com-access_log" combined

    # SSL
    SSLEngine On
    SSLCertificateFile /www/server/panel/vhost/cert/tuvacante.com/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/tuvacante.com/privkey.pem
    SSLCipherSuite EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5:ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP:+eNULL
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1
    SSLHonorCipherOrder On

    # Proxy reverso al backend NestJS (mismo server, puerto 3000)
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/
    ProxyPassReverse /api/ http://127.0.0.1:3000/

    # PHP handler
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/tmp/php-cgi-83.sock|fcgi://localhost"
    </FilesMatch>

    # Seguridad archivos
    <Files ~ (\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)$>
        Order allow,deny
        Deny from all
    </Files>

    # Directorio raíz
    <Directory "/www/wwwroot/front-v2-tuempleo/frontend/build/build">
        SetOutputFilter DEFLATE
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm default.php default.html default.htm
    </Directory>
</VirtualHost>
