name: Deploy to Dev Server

on:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    name: Deploy NestJS with Docker to Dev Server
    runs-on: self-hosted

    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no root@172.25.100.201 << 'EOF'
            set -x

            echo "🚀 Entrando al directorio del proyecto"
            cd /var/www/html/tuempleo.cl || { echo "❌ No se pudo acceder al directorio"; exit 1; }

            echo "✅ Añadiendo repositorio como seguro para Git"
            git config --global --add safe.directory /var/www/html/tuempleo.cl

            echo "🧽 Descartando cambios locales no comiteados"
            git reset --hard HEAD
            git clean -fd

            echo "📦 Haciendo pull de los últimos cambios"
            git pull origin dev || { echo "❌ Fallo al hacer git pull"; exit 1; }

            echo "🐳 Eliminando contenedor anterior si existe"
            docker stop backend-nest || echo "⚠️ No estaba corriendo"
            docker rm backend-nest || echo "⚠️ No existía"

            echo "🛠️ Construyendo nueva imagen Docker"
            docker build -t backend-nest . || { echo "❌ Fallo al construir la imagen"; exit 1; }

            echo "🚀 Ejecutando nuevo contenedor con variables de entorno"
            docker run -d \
              --name backend-nest \
              -p 3000:3000 \
              --env-file .env \
              --restart unless-stopped \
              backend-nest || { echo "❌ Fallo al ejecutar el contenedor"; exit 1; }

            echo "✅ Despliegue exitoso 🎉"
          EOF
